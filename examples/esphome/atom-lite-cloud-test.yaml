substitutions:
  name: atom-lite-cloud-test
  friendly_name: ATOM Lite Cloud Test
  collector_base_url: http://192.168.1.10:3000
  collector_key: 0123456789abcdef0123456789abcdef
  collector_device: atom_lite_test

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret wifi_ssid_ranch
      password: !secret wifi_password_ranch
      priority: 20
    - ssid: !secret wifi_ssid_rv
      password: !secret wifi_password_rv
      priority: 10

http_request:
  timeout: 5s
  watchdog_timeout: 15s
  verify_ssl: false

interval:
  - interval: 60s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: ${collector_base_url}/api/v1/readings?key=${collector_key}&device=${collector_device}&voltage=13.38&current=3.0&rssi=-99&charge_state=cloud_test
