substitutions:
  name: atom-lite-victron-cloud
  friendly_name: ATOM Lite Victron Cloud
  collector_base_url: https://iot.sunflower-vacations.com
  collector_key: replace-with-production-key
  collector_device: rv_charger
  victron_mac_address: 60:A4:23:91:8F:55
  victron_bindkey: 00000000000000000000000000000000

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - script.execute: show_status_offline

external_components:
  - source: github://Fabian-Schmidt/esphome-victron_ble

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:
  level: INFO

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF

script:
  - id: show_status_offline
    then:
      - light.turn_on:
          id: status_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 40%
          transition_length: 0s
  - id: show_status_waiting
    then:
      - light.turn_on:
          id: status_led
          red: 100%
          green: 65%
          blue: 0%
          brightness: 40%
          transition_length: 0s
  - id: show_status_success
    then:
      - light.turn_on:
          id: status_led
          red: 0%
          green: 100%
          blue: 0%
          brightness: 40%
          transition_length: 0s

api:

ota:
  - platform: esphome

wifi:
  on_connect:
    - script.execute: show_status_waiting
  on_disconnect:
    - script.execute: show_status_offline
  networks:
    - ssid: !secret wifi_ssid_rv
      password: !secret wifi_password_rv
      priority: 20
    - ssid: !secret wifi_ssid_ranch
      password: !secret wifi_password_ranch
      priority: 10

http_request:
  timeout: 5s
  watchdog_timeout: 15s
  verify_ssl: false

esp32_ble_tracker:
  scan_parameters:
    active: false

victron_ble:
  - id: victron_charger
    mac_address: ${victron_mac_address}
    bindkey: ${victron_bindkey}
    on_ac_charger_message:
      - logger.log:
          level: INFO
          format: "Decoded Victron AC charger advertisement"

sensor:
  - platform: victron_ble
    victron_ble_id: victron_charger
    name: Battery Voltage
    id: battery_voltage
    type: BATTERY_VOLTAGE
  - platform: victron_ble
    victron_ble_id: victron_charger
    name: Battery Current
    id: battery_current
    type: BATTERY_CURRENT
  - platform: victron_ble
    victron_ble_id: victron_charger
    name: AC Current
    id: ac_current
    type: AC_CURRENT
  - platform: victron_ble
    victron_ble_id: victron_charger
    name: Charger Error Code
    id: charger_error_code
    type: CHARGER_ERROR

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      id: wifi_ip_address
  - platform: victron_ble
    victron_ble_id: victron_charger
    name: Device State
    id: device_state
    type: DEVICE_STATE
  - platform: victron_ble
    victron_ble_id: victron_charger
    name: Charger Error
    id: charger_error
    type: CHARGER_ERROR

interval:
  - interval: 60s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - if:
                condition:
                  lambda: return !isnan(id(battery_voltage).state) && !isnan(id(battery_current).state);
                then:
                  - logger.log:
                      level: INFO
                      format: "Uploading Victron reading: %.2f V, %.2f A"
                      args:
                        - id(battery_voltage).state
                        - id(battery_current).state
                  - http_request.post:
                      url: ${collector_base_url}/api/v1/readings?key=${collector_key}
                      request_headers:
                        Content-Type: application/json
                      json: !lambda |-
                        root["device"] = "${collector_device}";
                        JsonObject metrics = root["metrics"].to<JsonObject>();

                        JsonObject voltage = metrics["voltage"].to<JsonObject>();
                        voltage["value"] = id(battery_voltage).state;
                        voltage["unit"] = "V";

                        JsonObject current = metrics["current"].to<JsonObject>();
                        current["value"] = id(battery_current).state;
                        current["unit"] = "A";

                        if (!isnan(id(ac_current).state)) {
                          JsonObject ac_current_metric = metrics["ac_current"].to<JsonObject>();
                          ac_current_metric["value"] = id(ac_current).state;
                          ac_current_metric["unit"] = "A";
                        }

                        if (!id(device_state).state.empty()) {
                          metrics["device_state"] = id(device_state).state;
                        }
                        if (!id(charger_error).state.empty()) {
                          metrics["charger_error"] = id(charger_error).state;
                        }
                        if (!isnan(id(charger_error_code).state)) {
                          metrics["charger_error_code"] = id(charger_error_code).state;
                        }
                      on_response:
                        then:
                          - lambda: |-
                              if (response->status_code >= 200 && response->status_code < 300) {
                                ESP_LOGI("collector", "Collector accepted reading with HTTP %d", response->status_code);
                              } else {
                                ESP_LOGW("collector", "Collector returned HTTP %d", response->status_code);
                              }
                          - if:
                              condition:
                                lambda: return response->status_code >= 200 && response->status_code < 300;
                              then:
                                - script.execute: show_status_success
                              else:
                                - script.execute: show_status_offline
                      on_error:
                        then:
                          - script.execute: show_status_offline
                          - logger.log:
                              level: WARN
                              tag: collector
                              format: "Collector upload failed"
                else:
                  - script.execute: show_status_waiting
                  - logger.log:
                      level: INFO
                      format: "No Victron frame yet; uploading collector heartbeat"
                  - http_request.post:
                      url: ${collector_base_url}/api/v1/readings?key=${collector_key}
                      request_headers:
                        Content-Type: application/json
                      json: !lambda |-
                        root["device"] = "${collector_device}";
                        JsonObject metrics = root["metrics"].to<JsonObject>();
                        metrics["logger_status"] = "waiting_for_victron";
                        metrics["uptime_seconds"] = millis() / 1000;
                      on_response:
                        then:
                          - lambda: |-
                              if (response->status_code >= 200 && response->status_code < 300) {
                                ESP_LOGI("collector", "Collector accepted heartbeat with HTTP %d", response->status_code);
                              } else {
                                ESP_LOGW("collector", "Collector returned HTTP %d", response->status_code);
                              }
                          - if:
                              condition:
                                lambda: return response->status_code >= 200 && response->status_code < 300;
                              then:
                                - script.execute: show_status_waiting
                              else:
                                - script.execute: show_status_offline
                      on_error:
                        then:
                          - script.execute: show_status_offline
                          - logger.log:
                              level: WARN
                              tag: collector
                              format: "Collector heartbeat failed"
          else:
            - script.execute: show_status_offline
            - logger.log:
                level: INFO
                format: "Wi-Fi is not connected; skipping collector upload"
